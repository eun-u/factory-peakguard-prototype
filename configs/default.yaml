seed: 42
source: data/raw/task05_power/okm_augumented_2021.csv
output_dir: outputs
split:
  dev_frac: 0.85
  n_folds: 3
  test_start_origin: '2021-08-09 09:45:00'
  test_start_target: '2021-08-09 10:45:00'
  calibration_fraction: 0.20
freeze:
  not_before: '2026-10-01T18:00:00+09:00'
  human_approval_required: false
  reason: '2026-09-24 사용자 무개입 진행 지시; 날짜와 일회 평가 원칙은 유지'
horizons: [1, 4, 16, 96]
primary_horizon: 4
peak: {tau_quantile: 0.95, sensitivity: [0.90, 0.975], target_T_quantile: 0.95}
quantiles: [0.1, 0.5, 0.9, 0.95, 0.975]
conformal: {mondrian_bins: [0.5, 0.9], min_bin_size: 30}
lgbm:
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 600
  early_stopping: 60
  n_jobs: 4
  min_child_samples: 40
  grid:
    - {num_leaves: 15, min_child_samples: 40}
    - {num_leaves: 31, min_child_samples: 80}
peak_weight: [1, 2, 4]
alert: {rules: ['1/1', '2/2', '2/3'], prep_minutes: [15, 30, 60], default_prep_minutes: 30}
decision: {cl_ratios: [0.01, 0.05, 0.1, 0.2, 0.3, 0.5]}
shift: {fractions: [0.1, 0.2, 0.3], window_2026: ['11:00', '15:00']}
bootstrap: {n: 1000, block: day}
optional: {tsfm: false, peak_prob_classifier: false, expected_exceedance: true, pdp_ice: false}
tariff: {old: configs/tariff_2021.yaml, current: configs/tariff_2026.yaml}
