# 과제 ⑤ 파이프라인 설정. 모든 스크립트는 이 파일에서만 설정값을 읽는다.
# 경로는 저장소(또는 제출 ZIP) 루트 기준 상대경로다.

seed: 42
bootstrap_draws: 1000

data:
  # 원자료 CSV. 이 경로에 파일이 없으면 search_dir에서 열 이름으로 찾는다.
  path: data/raw/task05_power/okm_augumented_2021.csv
  search_dir: data/raw/task05_power
  encoding: utf-8-sig
  # 가정 A4: 15/30/45/60분 열은 HH:15, HH:30, HH:45, (HH+1):00에 끝나는 연속 15분 구간
  minute_columns: [15, 30, 45, 60]
  # SHA-256(data/README.md). 다르면 경고만 남기고 계속 실행한다.
  expected_sha256: 8f7af2e49366c93e1d6f5fdef4b5e350066c1792ac463c2c2886e370f4674830

output_dir: outputs

# 주 과제(A1): 예측 원점 t에서 t + horizon 시점의 15분 전력
one_hour:
  horizon_steps: 4            # 15분 x 4 = 1시간
  lags: [1, 2, 4, 8, 92, 96, 668, 672]
  split_fractions: [0.70, 0.85] # 학습 | 검증 | 테스트
  purge_origins: 4            # 경계 간격 = 예측거리
  peak_quantile: 0.95         # 가정 A5: 학습 구간 상위 5% 초과
  quantiles: [0.1, 0.5, 0.9, 0.95]

lightgbm:
  n_estimators: 180
  learning_rate: 0.05
  num_leaves: 15
  min_child_samples: 35
  colsample_bytree: 0.9
  reg_lambda: 1.0
  max_depth: 6
  n_jobs: 4
  verbosity: -1

baselines:
  seasonal: [day, week, average]
  persistence: [latest_15m, previous_hour_slot, recent_hour_mean]

# 시험 구간 이전에서만 수행하는 rolling-origin 개발 평가
rolling_origin:
  start_fractions: [0.30, 0.45, 0.60]
  width_fraction: 0.10

# 보조 과제(A1): 전날 23:45 기준 다음 날 일간 최대 15분 전력
daily_max:
  split_fractions: [0.70, 0.85]
  peak_quantile: 0.95

# 비용-손실 상대 경제가치(REV) 계산용 가상 비용비 C/L
cost_loss_ratios: [0.01, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

# 이하 분석은 동결된 1시간 모델 설정을 바꾸지 않는다.
sensitivity:
  peak_quantiles: [0.975, 0.95, 0.90]   # 가정 A5 민감도

horizon_curve:
  horizons_steps: [1, 4, 16, 96]        # 15분, 1시간, 4시간, 24시간 (개발 폴드에서만 평가)

conformal:
  # 개발 폴드 안에서 학습 앞부분으로 분위수 모델을 맞추고 뒷부분으로 보정한다.
  calibration_fraction: 0.20
  targets: [0.9, 0.95]

alerting:
  # k/n 연속 확인 규칙. 경보 규칙은 검증 구간에서 고르고 테스트에는 그대로 적용한다.
  rules: [[1, 1], [2, 2], [2, 3]]

shift_simulation:
  fractions: [0.10, 0.20, 0.30]
  # 이동한 생산량은 같은 날 경보가 없는 가동 시간(생산량 > 0)으로 옮기되,
  # 받는 시간의 계획 전력이 피크 경계 x cap_ratio를 넘지 않는 만큼만 옮긴다.
  cap_ratio: 0.95

conditions:
  shift_proxy_bins: [-1, 7, 15, 23]     # 00-08, 08-16, 16-24 (가정 A6: 교대 대리변수)
  shift_proxy_labels: ["00-08", "08-16", "16-24"]
  production_quantiles: [0.0, 0.5, 0.75, 1.0]

# Phase 0 재현 기준: 사전 검증(verification/results/05b_summary.json) 값
reproduction_targets:
  persistence_peak_position_mae: 27.73
  lgb_peak_position_mae: 17.77
  tolerance: 0.005
